<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>CustomVinaEditor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-start">
        <div class="brand">
          CustomVinaEditor
          <button class="brand-badge" id="versionBadge" title="版本信息">
            BETA
          </button>
        </div>
        <nav
          class="tool-menubar"
          id="toolMenus"
          role="menubar"
          aria-label="工具菜单"
        >
          <button
            class="tool-menu-trigger"
            id="fileMenuBtn"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="fileMenu"
          >
            文件
          </button>
          <div
            class="tool-menu"
            id="fileMenu"
            role="menu"
            aria-labelledby="fileMenuBtn"
            tabindex="-1"
            hidden
          >
            <button
              class="tool-menu-item"
              id="newBtn"
              role="menuitem"
              tabindex="-1"
            >
              <span class="tool-menu-label">新建</span>
            </button>
            <button
              class="tool-menu-item"
              id="importBtn"
              role="menuitem"
              tabindex="-1"
            >
              <span class="tool-menu-label">导入</span>
            </button>
            <button
              class="tool-menu-item"
              id="exportBtn"
              role="menuitem"
              tabindex="-1"
            >
              <span class="tool-menu-label">导出</span><kbd>Ctrl+S</kbd>
            </button>
          </div>
          <button
            class="tool-menu-trigger"
            id="editMenuBtn"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="editMenu"
            tabindex="-1"
          >
            编辑
          </button>
          <div
            class="tool-menu"
            id="editMenu"
            role="menu"
            aria-labelledby="editMenuBtn"
            tabindex="-1"
            hidden
          >
            <button
              class="tool-menu-item"
              id="undoBtn"
              role="menuitem"
              tabindex="-1"
              aria-label="撤销"
              title="撤销 Ctrl+Z"
            >
              <svg class="fa-icon" aria-hidden="true" focusable="false">
                <use href="vendor/fontawesome/fa6.svg#fa-rotate-left"></use>
              </svg>
              <span class="tool-menu-label">撤销</span><kbd>Ctrl+Z</kbd>
            </button>
            <button
              class="tool-menu-item"
              id="redoBtn"
              role="menuitem"
              tabindex="-1"
              aria-label="重做"
              title="重做 Ctrl+Shift+Z / Ctrl+Y"
            >
              <svg class="fa-icon" aria-hidden="true" focusable="false">
                <use href="vendor/fontawesome/fa6.svg#fa-rotate-right"></use>
              </svg>
              <span class="tool-menu-label">重做</span><kbd>Ctrl+Shift+Z</kbd>
            </button>
            <div class="tool-menu-separator" role="separator"></div>
            <button
              class="tool-menu-item"
              id="menuGroup"
              role="menuitem"
              tabindex="-1"
              data-command="group"
            >
              <svg class="fa-icon" aria-hidden="true" focusable="false">
                <use href="vendor/fontawesome/fa6.svg#fa-object-group"></use>
              </svg>
              <span class="tool-menu-label">编组</span><kbd>Ctrl+G</kbd>
            </button>
            <button
              class="tool-menu-item"
              id="menuUngroup"
              role="menuitem"
              tabindex="-1"
              data-command="ungroup"
            >
              <svg class="fa-icon" aria-hidden="true" focusable="false">
                <use href="vendor/fontawesome/fa6.svg#fa-object-ungroup"></use>
              </svg>
              <span class="tool-menu-label">解除编组</span
              ><kbd>Ctrl+Shift+G</kbd>
            </button>
          </div>
          <button
            class="tool-menu-trigger"
            id="aboutMenuBtn"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="aboutMenu"
            tabindex="-1"
          >
            关于
          </button>
          <div
            class="tool-menu"
            id="aboutMenu"
            role="menu"
            aria-labelledby="aboutMenuBtn"
            tabindex="-1"
            hidden
          >
            <a
              class="tool-menu-item"
              id="aboutMenuItem"
              role="menuitem"
              tabindex="-1"
              href="about.html"
              target="_blank"
              rel="noopener"
              title="在新标签页打开关于页面"
              ><span class="tool-menu-label">关于...</span></a
            >
          </div>
        </nav>
      </div>
      <div class="topbar-actions">
        <button
          class="btn-ghost behavior-trigger"
          id="behaviorBtn"
          title="编辑交互、状态与属性连线"
        >
          <svg class="fa-icon" aria-hidden="true" focusable="false">
            <use href="vendor/fontawesome/fa6.svg#fa-arrow-pointer"></use>
          </svg>
          行为节点
        </button>
        <button
          class="btn-ghost icon-only"
          id="sourceBtn"
          title="查看和编辑源码"
          aria-label="源码"
        >
          <svg class="fa-icon" aria-hidden="true" focusable="false">
            <use href="vendor/fontawesome/fa6.svg#fa-code"></use>
          </svg>
        </button>
        <button
          class="btn-theme icon-only"
          id="themeBtn"
          title="切换至深色模式"
          aria-label="切换至深色模式"
        >
          <svg class="fa-icon" aria-hidden="true" focusable="false">
            <use href="vendor/fontawesome/fa6.svg#fa-moon"></use>
          </svg></button
        ><button class="btn-run" id="runBtn">运行</button>
      </div>
    </header>
    <main class="workspace">
      <aside class="panel panel-left">
        <div class="panel-head">
          组件库 <span class="subtle">点击或拖入画板</span>
        </div>
        <div class="comp-list" id="compList"></div>
        <div class="panel-head layer-head">
          图层 <span id="layerCount"></span>
        </div>
        <div class="layer-actions" role="toolbar" aria-label="图层操作">
          <button class="mini-btn" data-command="group" title="编组 Ctrl+G">
            <svg class="fa-icon" aria-hidden="true" focusable="false">
              <use href="vendor/fontawesome/fa6.svg#fa-object-group"></use>
            </svg>
            编组</button
          ><button
            class="mini-btn"
            data-command="ungroup"
            title="解除编组 Ctrl+Shift+G"
          >
            <svg class="fa-icon" aria-hidden="true" focusable="false">
              <use href="vendor/fontawesome/fa6.svg#fa-object-ungroup"></use>
            </svg>
            解组</button
          ><button
            class="mini-btn"
            data-command="raise"
            title="上移图层"
            aria-label="上移图层"
          >
            <svg class="fa-icon" aria-hidden="true" focusable="false">
              <use href="vendor/fontawesome/fa6.svg#fa-arrow-up"></use>
            </svg></button
          ><button
            class="mini-btn"
            data-command="lower"
            title="下移图层"
            aria-label="下移图层"
          >
            <svg class="fa-icon" aria-hidden="true" focusable="false">
              <use href="vendor/fontawesome/fa6.svg#fa-arrow-down"></use>
            </svg>
          </button>
        </div>
        <input
          class="ctl layer-search"
          id="layerSearch"
          placeholder="搜索图层…"
          aria-label="搜索图层"
        />
        <div
          class="layer-tree"
          id="layerTree"
          role="tree"
          aria-label="图层树"
        ></div>
        <div class="panel-foot">
          <div class="cs-title">画板尺寸 <span class="subtle">DIP</span></div>
          <div class="cs-row">
            <input
              class="ctl"
              type="number"
              id="boardWInput"
              value="360"
              min="120"
              max="32768"
              aria-label="画板宽度"
            /><span>×</span
            ><input
              class="ctl"
              type="number"
              id="boardHInput"
              value="480"
              min="120"
              max="32768"
              aria-label="画板高度"
            />
          </div>
          <div class="cs-copyright">Copyright © 2026 Vilinko Studio</div>
        </div>
      </aside>
      <section class="canvas-area">
        <div class="canvas-tools" role="toolbar" aria-label="画布操作">
          <div class="tool-group">
            <button class="mini-btn" data-command="align-left" title="左对齐">
              ⇤</button
            ><button
              class="mini-btn"
              data-command="align-center"
              title="水平居中"
            >
              ↔</button
            ><button class="mini-btn" data-command="align-right" title="右对齐">
              ⇥</button
            ><button class="mini-btn" data-command="align-top" title="顶对齐">
              ⤒</button
            ><button
              class="mini-btn"
              data-command="align-middle"
              title="垂直居中"
            >
              ↕</button
            ><button
              class="mini-btn"
              data-command="align-bottom"
              title="底对齐"
            >
              ⤓</button
            ><select
              class="ctl compact-select"
              id="arrangeSelect"
              aria-label="等距分布"
            >
              <option value="">分布</option>
              <option value="distributeX">水平等距</option>
              <option value="distributeY">垂直等距</option>
            </select>
          </div>
          <div class="tool-group">
            <select
              class="ctl compact-select"
              id="previewState"
              aria-label="预览场景"
              hidden
            >
              <option value="expanded">展开</option>
              <option value="collapsed">收起</option>
              <option value="search">搜索</option>
              <option value="all">全部节点</option>
            </select>
            <button class="mini-btn" id="previewSettingsBtn" hidden>
              预览设置
            </button>
            <label class="check-label"
              ><input type="checkbox" id="showBase" />继承层</label
            ><label class="check-label"
              ><input type="checkbox" id="snapGrid" />网格吸附</label
            ><select
              class="ctl compact-select"
              id="zoomSelect"
              aria-label="画布缩放"
            >
              <option value="0.25">25%</option>
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1" selected>100%</option>
              <option value="1.5">150%</option>
              <option value="2">200%</option>
            </select>
          </div>
        </div>
        <div
          class="canvas-wrap"
          id="canvasWrap"
          tabindex="0"
          aria-label="编辑画布"
        >
          <div id="boardSizer">
            <div class="canvas-board" id="board">
              <div id="scene"></div>
              <div id="overlays"></div>
              <div class="board-empty" id="boardEmpty">
                <div class="be-icon">⬚</div>
                <p>从左侧添加组件，或导入 .vina 预设</p>
                <span class="be-sub">Shift 多选 · 拖动框选 · Ctrl+G 编组</span>
              </div>
            </div>
          </div>
        </div>
        <div class="statusbar">
          <span id="statusText" role="status" aria-live="polite">就绪</span
          ><span id="saveStatus">本地自动保存</span>
        </div>
      </section>
      <aside class="panel panel-right">
        <div class="panel-tabs">
          <button class="tab active" id="propertiesTab">属性</button
          ><button class="tab" id="variablesTab">变量与控件</button>
        </div>
        <div class="insp-body" id="inspBody"></div>
      </aside>
    </main>
    <input id="fileInput" type="file" accept=".vina,.json" hidden />
    <dialog id="editDialog" class="editor-dialog" aria-labelledby="dialogTitle">
      <form id="dialogForm">
        <div class="modal-head">
          <h3 id="dialogTitle"></h3>
          <button
            class="icon-btn"
            id="dialogClose"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <div class="dialog-body" id="dialogBody"></div>
        <p class="dialog-error" id="dialogError" role="alert"></p>
        <div class="modal-foot" id="dialogFoot"></div>
      </form>
    </dialog>
    <div class="modal-mask" id="versionMask" aria-hidden="true">
      <div
        class="modal modal-version"
        role="dialog"
        aria-modal="true"
        aria-labelledby="versionTitle"
      >
        <div class="modal-head">
          <h3 id="versionTitle">版本信息</h3>
          <button
            class="icon-btn"
            id="versionClose"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <div class="version-body">
          <div class="version-name">
            <span class="version-brand">CustomVinaEditor</span>
          </div>
          <p class="version-desc">
            Pogget 个性化组件的可视化编辑器，基于 CustomVina 规范构建。
          </p>
          <dl class="version-list">
            <div class="version-row">
              <dt>工具版本</dt>
              <dd>Beta 0.2.1</dd>
            </div>
            <div class="version-row">
              <dt>构建号</dt>
              <dd>build20261111_rel0_Beta6</dd>
            </div>
            <div class="version-row">
              <dt>更新时间</dt>
              <dd>2026-11-11</dd>
            </div>
          </dl>
        </div>
        <div class="modal-foot">
          <button class="btn-primary" id="versionOk" type="button">
            我知道了
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
